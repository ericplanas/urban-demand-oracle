services:

  postgres:
    image: postgres:16-alpine
    container_name: oracle_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    container_name: oracle_etl
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./services/etl:/app/services/etl
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    container_name: oracle_ml
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./services/ml:/app/services/ml
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: oracle_api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: oracle_dashboard
    env_file: .env
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./services/dashboard:/app/services/dashboard
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: oracle_network
